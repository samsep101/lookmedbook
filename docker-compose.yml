# docker-compose.yml
version: '3.8'

services:
  php:
    restart: unless-stopped
    container_name: php
    build:
      context: .
      dockerfile: Dockerfile
    deploy:
      resources:
        limits:
          cpus: "8"
    # или используйте image: если уже собрали
    volumes:
      - ./:/var/www
    networks:
      - app-network
  nginx:
    restart: unless-stopped
    container_name: nginx
    image: docker.io/nginx:alpine
    ports:
      - "8080:80"  # Публикуем порт наружу
    volumes:
      - ./:/var/www  # Общий код
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - app-network
  elastic: 
    restart: unless-stopped
    container_name: elastic 
    image:  docker.elastic.co/elasticsearch/elasticsearch:5.6.0
    environment:
       - xpack.security.enabled=true
       - ELASTIC_PASSWORD=/1}M~9;A@]^=RYduf/*
    ports: 
       - "8200:9200"
       - "8300:9300"
    volumes: 
      - ./docker/elastic/plugins:/usr/share/elasticsearch/plugins
      - ./docker/elastic/data:/usr/share/elasticsearch/data 
    networks:
      - app-network
  memcached:
    restart: unless-stopped
    container_name: memcached
    image: docker.io/memcached:alpine
    ports:
      - "11211:11211"
    networks:
      - app-network
  mysql:
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "8"
          memory: 16G 
    container_name: mysql
    image: docker.io/mysql:5.7  # MySQL 5.7 - самая стабильная с PHP 5.6
    ports:
      - "3306:3306"  # Опционально, если нужен доступ с хоста
    environment:
      - MYSQL_ROOT_PASSWORD=dfghmt563
      - MYSQL_DATABASE=lookmedbook
      - MYSQL_USER=lookmedbook  # Опционально
      - MYSQL_PASSWORD=dfghmt563  # Опционально
    volumes:
      - ./docker/mysql_etc:/etc/mysql
      - ./docker/mysql/:/var/lib/mysql  # Сохраняем данные БД
    networks:
      - app-network
    command: 
      - --bind-address=0.0.0.0  # Явно слушаем на всех интерфейсах
      - --innodb-buffer-pool-size=28G
      - --innodb_log_file_size=512mb
      - --key-buffer-size=256M
      - --max-connections=100
      - --thread_cache_size=200
      - --max_allowed_packet=32M
      - --query_cache_size=0
      - --join_buffer_size=2097152
      - --tmp_table_size=64mb
      - --max_heap_table_size=128mb
networks:
  app-network:
    driver: bridge
